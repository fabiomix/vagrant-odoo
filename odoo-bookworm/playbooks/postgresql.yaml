---
- name: PostgreSQL
  hosts: all
  become: yes

  tasks:
    - name: Add key
      ansible.builtin.apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        keyring: /usr/share/keyrings/postgresql-keyring.gpg

    - name: Add repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg]
          https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main
        state: present

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql-15
          - postgresql-client-15
          - python3-psycopg2
        state: present

    # - name: Create Odoo user
    #   become: true
    #   become_user: postgres
    #   community.postgresql.postgresql_user:
    #     name: odoo
    #     password: odoo

    - name: Set .pgpass
      ansible.builtin.template:
        src: ../templates/postgres.pgpass.j2
        dest: /home/vagrant/.pgpass
        owner: vagrant
        group: vagrant
        mode: "0600"
